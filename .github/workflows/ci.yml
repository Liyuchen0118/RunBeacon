name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-tests:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:all

  package:
    name: Package and installers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:package
      - run: npm run test:installer
      - run: npm pack --dry-run

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm audit --audit-level=high --registry=https://registry.npmjs.org

  runner:
    name: Go Runner ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go test ./...
      - if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...
      - if: matrix.os == 'ubuntu-latest'
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  runner-assets:
    name: Runner assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Build four release targets
        run: |
          mkdir -p ../runner-assets
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o ../runner-assets/runbeacon-runner-linux-x64 ./cmd/runbeacon-runner
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o ../runner-assets/runbeacon-runner-linux-arm64 ./cmd/runbeacon-runner
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o ../runner-assets/runbeacon-runner-darwin-x64 ./cmd/runbeacon-runner
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -o ../runner-assets/runbeacon-runner-darwin-arm64 ./cmd/runbeacon-runner
          cd ../runner-assets
          sha256sum runbeacon-runner-* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-runner-assets
          path: runner-assets/
          retention-days: 7
