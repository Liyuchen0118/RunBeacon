name: Test Suite

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  platform-lifecycle:
    name: ${{ matrix.os }} Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm run test:all
      - run: npm run test:lifecycle:mcp
      - run: npm run test:lifecycle:daemon

  ssh-smoke:
    name: SSH smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Configure test SSH daemon
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo useradd -m -s /bin/bash testuser
          echo 'testuser:testpass' | sudo chpasswd
          sudo mkdir -p /run/sshd
          sudo sh -c '/usr/sbin/sshd -D -e -p 2222 -o ListenAddress=127.0.0.1 -o PasswordAuthentication=yes -o PubkeyAuthentication=no >/tmp/runbeacon-sshd.log 2>&1' &
          for _ in {1..20}; do ss -ltn | grep -q '127.0.0.1:2222' && exit 0; sleep .5; done
          cat /tmp/runbeacon-sshd.log
          exit 1
      - run: npm run test:ssh:smoke
        env:
          SSH_TEST_PORT: 2222
          SSH_TEST_USER: testuser
          SSH_TEST_PASS: testpass

  stress:
    name: Lifecycle stress
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:security:performance
      - run: npm run test:stress:smoke

  github-publish:
    name: GitHub publishing regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:github-publish

  # Temporary compatibility analysis. Keep this job identity until one main
  # scan closes alerts from the pre-3.0 source tree, then remove the job.
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
