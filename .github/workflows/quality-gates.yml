name: Quality Gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-quality:
    name: Format, lint, and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  package-boundary:
    name: Core package boundary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Reject legacy runtime files in the npm tarball
        run: |
          npm pack --json > pack.json
          node -e "const p=require('./pack.json')[0]; const bad=p.files.filter(f=>/^dist\/(core|protocols|testing)\//.test(f.path)); if(bad.length){console.error(bad);process.exit(1)}"
