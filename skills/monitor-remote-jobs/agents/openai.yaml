interface:
  display_name: "RunBeacon Remote Jobs"
  short_description: "Durable SSH, training, signing, and GitHub jobs"
  default_prompt: "Use $monitor-remote-jobs to run and monitor this remote or GitHub task durably through RunBeacon."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "runbeacon"
      description: "Durable RunBeacon jobs, credentials, events, and single-task dashboard"
